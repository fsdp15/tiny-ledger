spring:
  application:
    name: tiny-ledger
  jackson:
    default-property-inclusion: non_null

ledger:
  default-currency: EUR
  max-transaction-amount: 1000000.00
  default-page-size: 20
  max-page-size: 100
  idempotency-ttl: PT24H
  max-idempotency-keys: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
